<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sm@RT Print - NUDESA Mobile 2</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary-dark: #1e293b; --surface: #ffffff; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-box { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; }
    </style>
</head>
<body class="p-4">

<main class="max-w-md mx-auto">
    <section class="bg-white p-5 rounded-3xl shadow-xl border border-slate-100">
        <h3 class="text-lg font-bold text-slate-800 mb-4">
            <i class="fas fa-print me-2 text-blue-600"></i>Cetak Struk NUDESA
        </h3>
        
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Pelanggan</label>
                <input type="text" id="manual-nama" class="input-box" placeholder="Budi Santoso">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Wilayah</label>
                <select id="manual-alamat" class="input-box">
                    <option value="SUKANAGARA">SUKANAGARA</option>
                    <option value="TAKOKAK">TAKOKAK</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Tagihan (Rp)</label>
                    <input type="number" id="manual-tagihan" class="input-box text-right" placeholder="0">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Status</label>
                    <select id="manual-status" class="input-box">
                        <option value="KONTAN">KONTAN</option>
                        <option value="HUTANG">HUTANG</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="flex gap-2 mt-6">
            <button id="btnConnect" class="flex-1 bg-slate-800 text-white rounded-xl py-3 font-bold text-sm shadow-lg active:scale-95 transition-transform">
                <i class="fab fa-bluetooth-b me-2"></i>Connect
            </button>
            <button id="btnPrint" class="flex-1 bg-green-500 text-white rounded-xl py-3 font-bold text-sm shadow-lg active:scale-95 transition-transform">
                <i class="fas fa-print me-2"></i>Cetak
            </button>
        </div>
        <p id="statusPrinter" class="text-[10px] text-center mt-3 text-slate-400 italic">Printer belum terhubung</p>
    </section>
</main>

<script type="module">
    import EscPosEncoder from "https://unpkg.com/esc-pos-encoder@1.0.1/dist/esc-pos-encoder.js";

    let bluetoothDevice;
    let printCharacteristic;

    // Inisialisasi tombol setelah DOM dimuat
    window.onload = () => {
        document.getElementById('btnConnect').onclick = () => connectBluetooth();
        document.getElementById('btnPrint').onclick = () => printManualReceipt();
    };

    async function connectBluetooth() {
        try {
            const OPTIONAL_SERVICES = ['000018f0-0000-1000-8000-00805f9b34fb', '0000ff00-0000-1000-8000-00805f9b34fb'];
            
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: OPTIONAL_SERVICES
            });

            Swal.fire({ title: 'Menghubungkan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const server = await bluetoothDevice.gatt.connect();
            
            // Mencari Service & Characteristic
            const services = await server.getPrimaryServices();
            for (const service of services) {
                const characteristics = await service.getCharacteristics();
                printCharacteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
                if (printCharacteristic) break;
            }

            if (!printCharacteristic) throw new Error("Printer tidak mendukung pengiriman data.");

            document.getElementById('statusPrinter').innerText = `Terhubung: ${bluetoothDevice.name}`;
            Swal.fire('Berhasil!', `Printer ${bluetoothDevice.name} siap!`, 'success');

        } catch (error) {
            console.error(error);
            Swal.fire('Gagal', 'Koneksi dibatalkan atau error: ' + error.message, 'error');
        }
    }

    async function printManualReceipt() {
        if (!printCharacteristic) {
            return Swal.fire('Peringatan', 'Hubungkan bluetooth dulu!', 'warning');
        }

        const nama = document.getElementById('manual-nama').value || '-';
        const alamat = document.getElementById('manual-alamat').value || '-';
        const tagihan = new Intl.NumberFormat('id-ID').format(document.getElementById('manual-tagihan').value || 0);
        const status = document.getElementById('manual-status').value;

        try {
            const encoder = new EscPosEncoder();
            
            // Membuat data cetak (Format 58mm / 32 Karakter)
            const result = encoder
                .initialize()
                .align('center')
                .line('SM@RT DIGITAL')
                .line('NUDESA MOBILE')
                .line('--------------------------------')
                .align('left')
                .line(`NAMA  : ${nama.toUpperCase()}`)
                .line(`ALMT  : ${alamat}`)
                .line(`TGL   : ${new Date().toLocaleDateString('id-ID')}`)
                .line('--------------------------------')
                .line(`TOTAL : Rp ${tagihan}`)
                .line(`STATUS: ${status}`)
                .line('--------------------------------')
                .align('center')
                .line('SIMPAN SEBAGAI BUKTI')
                .newline()
                .newline()
                .encode();

            // Kirim data per paket 20 bytes (Wajib untuk Bluetooth Android)
            const chunkSize = 20;
            for (let i = 0; i < result.length; i += chunkSize) {
                await printCharacteristic.writeValue(result.slice(i, i + chunkSize));
            }

            Swal.fire('Sukses', 'Struk dicetak!', 'success');
        } catch (error) {
            Swal.fire('Error', 'Gagal cetak: ' + error.message, 'error');
        }
    }
</script>
</body>
</html>
