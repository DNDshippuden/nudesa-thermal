<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sm@RT Print - Bluetooth Center</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Library Baru: WebBluetoothReceiptPrinter -->
    <script src="webbluetooth-receipt-printer.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary-dark: #1e293b; --surface: #ffffff; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-box { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; }
    </style>
</head>
<body class="p-4">

<main class="max-w-md mx-auto">
    <section class="bg-white p-5 rounded-3xl shadow-xl border border-slate-100">
        <h3 class="text-lg font-bold text-slate-800 mb-4"><i class="fas fa-print me-2"></i>Cetak Struk NUDESA mobile</h3>
        
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Pelanggan</label>
                <input type="text" id="manual-nama" class="input-box" placeholder="Budi Santoso">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Alamat</label>
                <!-- <input type="text" id="manual-alamat" class="input-box" placeholder="Alamat lengkap"> -->
                <select id="manual-alamat" class="input-box">
                    <option value="SUKANAGARA">SUKANAGARA</option>
                    <option value="TAKOKAK">TAKOKAK</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Tagihan (Rp)</label>
                    <input type="number" id="manual-tagihan" class="input-box text-right" placeholder="0">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Status</label>
                    <select id="manual-status" class="input-box">
                        <option value="KONTAN">KONTAN</option>
                        <option value="HUTANG">HUTANG</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="flex gap-2 mt-6">
            <button onclick="handleConnectButtonClick()" class="flex-1 bg-slate-800 text-white rounded-xl py-3 font-bold text-sm shadow-lg active:scale-95 transition-transform">
                <i class="fab fa-bluetooth-b me-2"></i>Connect
            </button>
            <button onclick="printManualReceipt()" class="flex-1 bg-green-500 text-white rounded-xl py-3 font-bold text-sm shadow-lg active:scale-95 transition-transform">
                <i class="fas fa-print me-2"></i>Cetak
            </button>
        </div>
        <p id="statusPrinter" class="text-[10px] text-center mt-3 text-slate-400 italic">Printer belum terhubung</p>
    </section>
</main>

<script>
    // Inisialisasi library
    const receiptPrinter = new WebBluetoothReceiptPrinter();
    let lastUsedDevice = null;
    let printerLanguage = 'esc-pos'; // Default
    let printerCodepageMapping = 'standard'; // Default
    
    // Event Listener saat printer terhubung
    receiptPrinter.addEventListener('connected', device => {
        console.log(`Connected to ${device.name} (#${device.id})`);
        document.getElementById('statusPrinter').innerText = `Terhubung: ${device.name}`;
        
        // Ambil detail bahasa printer dari device
        printerLanguage = device.language;
        printerCodepageMapping = device.codepageMapping;
        
        lastUsedDevice = device;
        
        // Simpan ke local storage
        localStorage.setItem('last_printer', JSON.stringify({
            id: device.id, 
            name: device.name,
            language: device.language,
            codepageMapping: device.codepageMapping
        }));
        
        Swal.fire('Terhubung!', `Printer ${device.name} siap digunakan.`, 'success');
    });
    
    // Mencoba Reconnect otomatis
    window.onload = () => {
        const saved = localStorage.getItem('last_printer');
        if (saved) {
            const config = JSON.parse(saved);
            lastUsedDevice = config; // Set data awal
            printerLanguage = config.language;
            printerCodepageMapping = config.codepageMapping;
            receiptPrinter.reconnect(config);
        }
    };
    
    // Fungsi tombol Connect
    async function handleConnectButtonClick() {
        try {
            // Beberapa browser butuh interaksi user yang sangat jelas
            await receiptPrinter.connect();
        } catch (e) {
            console.error(e);
            // Jika error mengandung kata "User cancelled", itu berarti dialog ditutup
            Swal.fire('Info', 'Koneksi dibatalkan atau printer tidak dipilih.', 'info');
        }
    }
    
    // Fungsi Cetak Struk
    async function printManualReceipt() {
        if (!lastUsedDevice) {
            return Swal.fire('Peringatan', 'Hubungkan printer dulu!', 'warning');
        }
    
        const nama = document.getElementById('manual-nama').value || '-';
        const alamat = document.getElementById('manual-alamat').value || '-';
        const tagihan = new Intl.NumberFormat('id-ID').format(document.getElementById('manual-tagihan').value || 0);
        const status = document.getElementById('manual-status').value;
    
        try {
            // Penting: Sertakan language dan codepage agar karakter tidak error
            const encoder = new receiptPrinter.encoder({
                language: printerLanguage,
                codepageMapping: printerCodepageMapping
            }); 
            
            let data = encoder
                .initialize()
                .align('center')
                .line('SM@RT DIGITAL')
                .line('WADAH RT 001/002')
                .line('--------------------------------')
                .align('left')
                .line(`NAMA  : ${nama.toUpperCase()}`)
                .line(`ALMT  : ${alamat}`)
                .line(`TGL   : ${new Date().toLocaleDateString('id-ID')}`)
                .line('--------------------------------')
                .line(`TOTAL : Rp ${tagihan}`)
                .line(`STATUS: ${status}`)
                .line('--------------------------------')
                .align('center')
                .line('SIMPAN SEBAGAI BUKTI')
                .newline()
                .newline()
                .cut() // Tambahkan cut jika printer mendukung
                .encode();
    
            await receiptPrinter.print(data);
            Swal.fire('Sukses', 'Struk berhasil dicetak!', 'success');
        } catch (e) {
            console.error(e);
            Swal.fire('Error', 'Gagal mencetak: ' + e.message, 'error');
        }
    }
</script>
</body>
</html>
