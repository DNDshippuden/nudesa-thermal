<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sm@RT Print - NUDESA Mobile</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Load Library UMD agar WebBluetoothReceiptPrinter tersedia secara global -->
    <script src="webbluetooth-receipt-printer.umd.js"></script>

    <style>
        :root { --primary-dark: #1e293b; --surface: #ffffff; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-box { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 0.5rem; outline: none; }
        .btn-disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body class="p-4">

<main class="max-w-md mx-auto">
    <section class="bg-white p-5 rounded-3xl shadow-xl border border-slate-100">
        <h3 class="text-lg font-bold text-slate-800 mb-4">
            <i class="fas fa-print me-2 text-blue-600"></i>Cetak Struk NUDESA Mob
        </h3>
        
        <!-- Form Input -->
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Nama Pelanggan</label>
                <input type="text" id="manual-nama" class="input-box" placeholder="Budi Santoso">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">Wilayah</label>
                <select id="manual-alamat" class="input-box">
                    <option value="SUKANAGARA">SUKANAGARA</option>
                    <option value="TAKOKAK">TAKOKAK</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Tagihan (Rp)</label>
                    <input type="number" id="manual-tagihan" class="input-box text-right" placeholder="0">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Status</label>
                    <select id="manual-status" class="input-box">
                        <option value="KONTAN">KONTAN</option>
                        <option value="HUTANG">HUTANG</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Tombol Aksi -->
        <div class="flex gap-2 mt-6">
            <button id="btnConnect" onclick="connectPrinterManually()" class="flex-1 bg-slate-800 text-white rounded-xl py-3 font-bold text-sm shadow-lg active:scale-95 transition-transform">
                <i class="fab fa-bluetooth-b me-2"></i>Connect
            </button>
            <button id="btnPrint" onclick="printManualReceipt()" class="flex-1 bg-green-500 text-white rounded-xl py-3 font-bold text-sm shadow-lg active:scale-95 transition-transform">
                <i class="fas fa-print me-2"></i>Cetak
            </button>
        </div>
        <p id="statusPrinter" class="text-[10px] text-center mt-3 text-slate-400 italic">Printer belum terhubung</p>
    </section>
</main>

<script>
    // State Management sesuai permintaan
    let receiptPrinter = null;
    let isConnectingPrinter = false;
    let isPrinterConnected = false;
    let printerSettings = null;
    let connectedPrinterName = "";

    // 1. SETUP PRINTER
    function setupBluetoothPrinter() {
        receiptPrinter = new WebBluetoothReceiptPrinter();
        
        receiptPrinter.addEventListener('connected', device => {
            applyPrinterConnection_(device);
        });

        receiptPrinter.addEventListener('disconnected', () => {
            isPrinterConnected = false;
            connectedPrinterName = "";
            printerSettings = null;
            document.getElementById('statusPrinter').innerText = "Terputus";
            updateConnectPrinterButtonState();
        });
    }

    // 2. FUNGSI KONEK UTAMA (Sesuai Logika Anda)
    async function connectPrinterManually() {
        if (isConnectingPrinter) return;

        const contextIssue = getBluetoothContextIssue_();
        if (contextIssue) {
            Swal.fire('Error', contextIssue, 'error');
            return;
        }

        if (typeof WebBluetoothReceiptPrinter !== 'function') {
            Swal.fire('Error', 'Modul printer belum termuat. Periksa internet.', 'error');
            return;
        }

        if (!receiptPrinter) setupBluetoothPrinter();

        setConnectingPrinterState_(true);
        try {
            const device = await receiptPrinter.connect();
            applyPrinterConnection_(device);
            
            // Tunggu sebentar untuk memastikan handshake selesai
            await waitForPrinterSettings_(1500); 

            if (!isPrinterConnected) {
                throw new Error('Printer belum terhubung sepenuhnya.');
            }
            
            Swal.fire('Berhasil', `Printer terhubung: ${connectedPrinterName}`, 'success');
        } catch (error) {
            console.error(error);
            Swal.fire('Gagal', parsePrinterError_(error), 'error');
        } finally {
            setConnectingPrinterState_(false);
            updateConnectPrinterButtonState();
        }
    }

    // --- HELPER FUNCTIONS ---

    function getBluetoothContextIssue_() {
        if (!navigator.bluetooth) return "Browser ini tidak mendukung Bluetooth.";
        if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
            return "Web Bluetooth memerlukan koneksi HTTPS.";
        }
        return null;
    }

    function setConnectingPrinterState_(state) {
        isConnectingPrinter = state;
        updateConnectPrinterButtonState();
    }

    function applyPrinterConnection_(device) {
        isPrinterConnected = true;
        connectedPrinterName = device.name;
        printerSettings = {
            language: device.language,
            codepageMapping: device.codepageMapping
        };
        document.getElementById('statusPrinter').innerText = `Terhubung: ${device.name}`;
    }

    function updateConnectPrinterButtonState() {
        const btn = document.getElementById('btnConnect');
        if (isConnectingPrinter) {
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Connecting...';
            btn.classList.add('btn-disabled');
        } else {
            btn.innerHTML = '<i class="fab fa-bluetooth-b me-2"></i>Connect';
            btn.classList.remove('btn-disabled');
        }
    }

    function waitForPrinterSettings_(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function parsePrinterError_(error) {
        if (error.name === 'NotFoundError' || error.message.includes('User cancelled')) {
            return "Pencarian dibatalkan.";
        }
        return error.message || "Terjadi kesalahan koneksi.";
    }

    // 3. FUNGSI CETAK
    async function printManualReceipt() {
        if (!isPrinterConnected || !receiptPrinter) {
            return Swal.fire('Peringatan', 'Hubungkan printer dulu!', 'warning');
        }

        const nama = document.getElementById('manual-nama').value || '-';
        const alamat = document.getElementById('manual-alamat').value;
        const tagihan = new Intl.NumberFormat('id-ID').format(document.getElementById('manual-tagihan').value || 0);
        const status = document.getElementById('manual-status').value;

        try {
            const encoder = new receiptPrinter.encoder({
                language: printerSettings.language,
                codepageMapping: printerSettings.codepageMapping
            });

            const data = encoder
                .initialize()
                .align('center')
                .line('SM@RT DIGITAL')
                .line('NUDESA MOBILE')
                .line('--------------------------------')
                .align('left')
                .line(`NAMA  : ${nama.toUpperCase()}`)
                .line(`ALMT  : ${alamat}`)
                .line(`TGL   : ${new Date().toLocaleDateString('id-ID')}`)
                .line('--------------------------------')
                .line(`TOTAL : Rp ${tagihan}`)
                .line(`STATUS: ${status}`)
                .line('--------------------------------')
                .align('center')
                .line('SIMPAN SEBAGAI BUKTI')
                .newline()
                .newline()
                .encode();

            await receiptPrinter.print(data);
            Swal.fire('Sukses', 'Struk dicetak!', 'success');
        } catch (e) {
            Swal.fire('Error', 'Gagal cetak: ' + e.message, 'error');
        }
    }
</script>
</body>
</html>
