<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sm@RT Print - Bluetooth Center</title>
  
  <!-- CDNs -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/esc-pos-encoder@2.1.0/dist/esc-pos-encoder.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen">

  <div class="max-w-md mx-auto px-6 pt-10">
    <!-- Header -->
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-600 text-white rounded-3xl mb-4 shadow-xl shadow-blue-200">
        <i class="fa-brands fa-bluetooth-b text-4xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Sm@RT Print</h1>
      <p class="text-slate-500 text-sm">Cetak Struk Langsung dari Android</p>
    </div>

    <!-- Tombol Scan -->
    <div class="glass-card rounded-3xl p-6 shadow-xl border border-white mb-8">
      <button onclick="pairingPrinterBaru()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-6 rounded-2xl flex items-center justify-center gap-3 transition-all shadow-lg active:scale-95">
        <i class="fas fa-search"></i>
        Cari & Pasangkan Printer
      </button>
    </div>

    <!-- Daftar Printer Tersimpan -->
    <div class="flex items-center justify-between mb-4 px-2">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">Printer Tersimpan</h2>
      <button onclick="hapusSemuaHistory()" class="text-red-400 text-[10px] font-bold">HAPUS SEMUA</button>
    </div>

    <div id="listPrinterContainer" class="space-y-4">
      <!-- Item printer akan muncul di sini via JS -->
    </div>

    <!-- Info Footer -->
    <div id="emptyState" class="hidden text-center py-10 bg-white rounded-3xl border-2 border-dashed border-slate-200 mt-4">
      <i class="fas fa-print text-slate-200 text-4xl mb-3"></i>
      <p class="text-slate-400 text-xs">Belum ada printer yang terdaftar di HP ini</p>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'SMART_PRINTER_LOG';

    // 1. Fungsi Pairing (Mencari Perangkat Baru)
    async function pairingPrinterBaru() {
      if (!navigator.bluetooth) {
        return Swal.fire('Error', 'Browser tidak mendukung Bluetooth. Gunakan Chrome di Android.', 'error');
      }

      try {
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'ff00']
        });

        const newPrinter = {
          id: device.id,
          name: device.name || 'Thermal Printer',
          date: new Date().toLocaleString('id-ID')
        };

        simpanKeLocalStorage(newPrinter);
        
        Swal.fire({
          icon: 'success',
          title: 'Berhasil Pairing',
          text: `${newPrinter.name} telah disimpan di browser ini.`,
          timer: 2000
        });

        muatDaftarPrinter();

      } catch (error) {
        console.log("User membatalkan pencarian");
      }
    }

    // 2. Simpan Data ke LocalStorage HP
    function simpanKeLocalStorage(printer) {
      let saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      const exists = saved.find(p => p.id === printer.id);
      if (!exists) {
        saved.push(printer);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
      }
    }

    // 3. Menampilkan Daftar Printer
    function muatDaftarPrinter() {
      const container = document.getElementById('listPrinterContainer');
      const empty = document.getElementById('emptyState');
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

      container.innerHTML = '';
      
      if (saved.length === 0) {
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');
      saved.forEach(p => {
        container.innerHTML += `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center">
                <i class="fas fa-print"></i>
              </div>
              <div>
                <div class="font-bold text-slate-800 text-sm">${p.name}</div>
                <div class="text-[10px] text-slate-400">${p.date}</div>
              </div>
            </div>
            <button onclick="ujiCobaCetak('${p.id}')" class="bg-blue-600 text-white text-[10px] font-bold px-4 py-2 rounded-xl shadow-md">
              TEST PRINT
            </button>
          </div>
        `;
      });
    }

    // 4. Fungsi Cetak Uji Coba (ESC/POS 58mm)
    async function ujiCobaCetak(deviceId) {
      try {
        Swal.fire({ title: 'Menghubungkan...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        // Browser butuh requestDevice lagi untuk mendapatkan izin session
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ id: deviceId }],
          optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'ff00']
        });

        const server = await device.gatt.connect();
        const services = await server.getPrimaryServices();
        let service = services[0];
        const characteristics = await service.getCharacteristics();
        let characteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);

        const encoder = new EscPosEncoder();
        let data = encoder
          .initialize()
          .align('center')
          .line('SM@RT DIGITAL')
          .line('RT 001/002')
          .line('--------------------------------')
          .line('UJI COBA BERHASIL!')
          .line(new Date().toLocaleTimeString())
          .line('--------------------------------')
          .newline()
          .newline()
          .encode();

        // Kirim data dalam paket kecil (20 bytes) agar printer tidak hang
        const chunkSize = 20;
        for (let i = 0; i < data.length; i += chunkSize) {
          await characteristic.writeValue(data.slice(i, i + chunkSize));
        }

        Swal.fire('Sukses', 'Data berhasil dicetak!', 'success');

      } catch (error) {
        Swal.fire('Gagal', error.message, 'error');
      }
    }

    function hapusSemuaHistory() {
      localStorage.removeItem(STORAGE_KEY);
      muatDaftarPrinter();
    }

    // Load list saat buka halaman
    window.onload = muatDaftarPrinter;
  </script>
</body>
</html>
