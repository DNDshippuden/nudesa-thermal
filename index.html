<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Struk Bluetooth - Sm@RT Digital</title>
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/esc-pos-encoder@2.1.0/dist/esc-pos-encoder.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-dark: #1e293b;
            --success: #22c55e;
            --surface: #ffffff;
            --border: #e2e8f0;
            --radius-md: 1rem;
            --shadow-soft: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .input-box {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-box:focus { border-color: #3b82f6; }
    </style>
</head>
<body class="p-4">

<main class="max-w-md mx-auto">
    <!-- Section Input Manual -->
    <section class="manual-input-card" style="background: var(--surface); padding: 1.2rem; border-radius: var(--radius-md); border: 1px solid var(--border); margin-bottom: 1.5rem; box-shadow: var(--shadow-soft);">
        <h3 style="margin-bottom: 1rem; font-size: 1rem; color: var(--primary-dark); font-weight: 700;">
            <i class="fas fa-file-invoice me-2"></i>Input Struk Manual
        </h3>
        
        <div class="form-group" style="margin-bottom: 0.8rem;">
            <label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.3rem;">Nama Pelanggan</label>
            <input type="text" id="manual-nama" class="input-box" placeholder="Contoh: Desaku">
        </div>

        <div class="form-group" style="margin-bottom: 0.8rem;">
            <label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.3rem;">Alamat</label>
            <input type="text" id="manual-alamat" class="input-box" placeholder="Alamat lengkap">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem;">
            <div class="form-group">
                <label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.3rem;">Tagihan (Rp)</label>
                <input type="number" id="manual-tagihan" class="input-box" style="text-align: right;" placeholder="0">
            </div>
            <div class="form-group">
                <label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.3rem;">Status</label>
                <select id="manual-status" class="input-box">
                    <option value="KONTAN">KONTAN</option>
                    <option value="HUTANG">HUTANG</option>
                </select>
            </div>
        </div>

        <div style="margin-top: 1.2rem; display: flex; gap: 0.5rem;">
            <button onclick="connectPrinterManually()" class="bg-slate-800 text-white rounded-xl hover:bg-slate-700 transition-all" style="flex: 1; padding: 0.8rem; font-size: 0.8rem; font-weight: 600;">
                <i class="fab fa-bluetooth me-1"></i>Hubungkan
            </button>
            <button onclick="printManualReceipt()" class="bg-green-500 text-white rounded-xl hover:bg-green-600 transition-all" style="flex: 1; padding: 0.8rem; font-size: 0.8rem; font-weight: 600;">
                <i class="fas fa-print me-1"></i>Cetak Struk
            </button>
        </div>
    </section>
</main>

<script>
    let bluetoothDevice;
    let printCharacteristic;

    // 1. Fungsi Hubungkan Printer Bluetooth
    async function connectPrinterManually() {
        try {
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', 'ff00']
            });

            Swal.fire({ title: 'Menghubungkan...', didOpen: () => Swal.showLoading() });

            const server = await bluetoothDevice.gatt.connect();
            const services = await server.getPrimaryServices();
            
            // Mencari characteristic yang bisa menulis data (Write)
            for (const service of services) {
                const characteristics = await service.getCharacteristics();
                printCharacteristic = characteristics.find(c => c.properties.write || c.properties.writeWithoutResponse);
                if (printCharacteristic) break;
            }

            if (!printCharacteristic) throw new Error("Printer tidak mendukung pengiriman data.");

            Swal.fire('Berhasil!', `Terhubung ke ${bluetoothDevice.name}`, 'success');
        } catch (error) {
            Swal.fire('Gagal', error.message, 'error');
        }
    }

    // 2. Fungsi Cetak Struk Manual
    async function printManualReceipt() {
        if (!printCharacteristic) {
            return Swal.fire('Peringatan', 'Hubungkan printer Bluetooth terlebih dahulu!', 'warning');
        }

        const nama = document.getElementById('manual-nama').value || '-';
        const alamat = document.getElementById('manual-alamat').value || '-';
        const tagihan = document.getElementById('manual-tagihan').value || '0';
        const status = document.getElementById('manual-status').value;

        try {
            const encoder = new EscPosEncoder();
            const formattedTagihan = new Intl.NumberFormat('id-ID').format(tagihan);

            let data = encoder
                .initialize()
                .align('center')
                .line('SM@RT DIGITAL')
                .line('RT 001/002 - Kelurahan')
                .line('--------------------------------') // 32 chars for 58mm
                .align('left')
                .line(`Nama  : ${nama.substring(0, 20)}`)
                .line(`Almt  : ${alamat.substring(0, 20)}`)
                .line(`Tgl   : ${new Date().toLocaleDateString('id-ID')}`)
                .line('--------------------------------')
                .align('left')
                .line(`TOTAL : Rp ${formattedTagihan}`)
                .line(`STATUS: ${status}`)
                .line('--------------------------------')
                .align('center')
                .line('Terima Kasih Atas')
                .line('Pembayaran Anda')
                .newline()
                .newline()
                .encode();

            // Mengirim data per paket (chunk) 20 bytes agar stabil di Android
            const chunkSize = 20;
            for (let i = 0; i < data.length; i += chunkSize) {
                await printCharacteristic.writeValue(data.slice(i, i + chunkSize));
            }

            Swal.fire('Sukses', 'Struk berhasil dicetak!', 'success');
        } catch (error) {
            Swal.fire('Gagal Cetak', error.message, 'error');
        }
    }
</script>
</body>
</html>
